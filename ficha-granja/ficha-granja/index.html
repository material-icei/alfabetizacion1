<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Mi Ficha de Animales de la Granja</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;700;800&family=Caveat:wght@500;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="style.css" />
</head>
<body>

<!-- Formas decorativas flotantes -->
<div class="shapes" aria-hidden="true">
  <div class="shape shape-cloud c1">☁️</div>
  <div class="shape shape-cloud c2">☁️</div>
  <div class="shape shape-sun">☀️</div>
  <div class="shape shape-leaf l1">🌿</div>
  <div class="shape shape-leaf l2">🌾</div>
  <div class="shape shape-flower f1">🌼</div>
  <div class="shape shape-flower f2">🌻</div>
</div>

<main class="app">

  <!-- ============ PANTALLA 1: DATOS DEL ALUMNO ============ -->
  <section id="pantalla-inicio" class="pantalla activa">
    <div class="tarjeta tarjeta-inicio">
      <h1 class="titulo">🐮 MI FICHA DE LA GRANJA 🐔</h1>
      <p class="subtitulo">¡ANTES DE EMPEZAR, CONTANOS QUIÉN SOS!</p>

      <div class="campo">
        <label for="input-nombre-alumno">✏️ MI NOMBRE</label>
        <input type="text" id="input-nombre-alumno" placeholder="ESCRIBÍ TU NOMBRE" autocomplete="off" />
      </div>

      <div class="campo">
        <label for="input-grado">🏫 MI GRADO</label>
        <input type="text" id="input-grado" placeholder="EJ: 1° A" autocomplete="off" />
      </div>

      <p class="error-inline" id="error-inicio" hidden>COMPLETÁ TU NOMBRE Y TU GRADO PARA CONTINUAR</p>

      <button class="boton boton-grande" id="btn-empezar">EMPEZAR 🚜</button>
    </div>
  </section>

  <!-- ============ PANTALLA 2: SELECTOR DE ANIMAL ============ -->
  <section id="pantalla-selector" class="pantalla">
    <div class="encabezado-selector">
      <p class="saludo" id="saludo-alumno"></p>
      <h1 class="titulo titulo-chico">ELEGÍ UN ANIMAL PARA COMPLETAR SU FICHA</h1>
    </div>
    <div class="grilla-animales" id="grilla-animales"></div>
  </section>

  <!-- ============ PANTALLA 3: FICHA DEL ANIMAL ============ -->
  <section id="pantalla-ficha" class="pantalla">
    <div class="tarjeta tarjeta-ficha">
      <button class="boton-volver" id="btn-volver">⬅ VOLVER</button>

      <div class="ficha-imagen-wrap">
        <img id="ficha-imagen" src="" alt="" />
      </div>

      <div class="campo">
        <label for="input-nombre-animal">🐾 NOMBRE DEL ANIMAL</label>
        <input type="text" id="input-nombre-animal" class="cursiva" placeholder="Escribí el nombre" autocomplete="off" />
      </div>

      <div class="campo">
        <label for="input-oracion-1">✍️ ORACIÓN 1</label>
        <textarea id="input-oracion-1" class="cursiva" rows="2" placeholder="Escribí una oración sobre el animal"></textarea>
      </div>

      <div class="campo">
        <label for="input-oracion-2">✍️ ORACIÓN 2</label>
        <textarea id="input-oracion-2" class="cursiva" rows="2" placeholder="Escribí otra oración sobre el animal"></textarea>
      </div>

      <p class="error-inline" id="error-ficha" hidden>COMPLETÁ LOS 3 CUADROS ANTES DE GUARDAR</p>

      <button class="boton boton-grande" id="btn-guardar">GUARDAR ✅</button>
    </div>
  </section>

</main>

<!-- ============ MODAL DE ÉXITO ============ -->
<div id="modal-exito" class="modal-overlay" hidden>
  <div class="modal-caja">
    <div class="modal-emoji">🌟</div>
    <h2>¡FICHA GUARDADA!</h2>
    <p id="modal-texto">MUY BIEN, YA COMPLETASTE ESTA FICHA.</p>
    <button class="boton boton-grande" id="btn-modal-continuar">ELEGIR OTRO ANIMAL 🐣</button>
  </div>
</div>

<script src="config.js"></script>
<script src="data.js"></script>
<script src="game.js"></script>
</body>
</html>
