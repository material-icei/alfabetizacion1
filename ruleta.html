<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Ruleta de Letras 🎡</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet" />
<style>

/* ── ROOT ── */
:root {
  --bg-from: #1a1a2e;
  --bg-to:   #16213e;
  --gold:    #FFD700;
  --gold2:   #FFA500;
  --shine:   #fff9c4;
  --shadow-wheel: 0 0 60px rgba(255,215,0,0.25), 0 20px 80px rgba(0,0,0,0.6);

  /* 20 colores para los sectores */
  --c0:#FF6B6B;  --c1:#FF9F43;  --c2:#FECA57;  --c3:#48DBFB;
  --c4:#1DD1A1;  --c5:#FF6B9D;  --c6:#A29BFE;  --c7:#6C5CE7;
  --c8:#FD79A8;  --c9:#00CEC9;  --c10:#E17055; --c11:#74B9FF;
  --c12:#55EFC4; --c13:#FDCB6E; --c14:#E84393; --c15:#0984E3;
  --c16:#00B894; --c17:#D63031; --c18:#6D5BBA; --c19:#F9CA24;
}

*, *::before, *::after { box-sizing: border-box; margin:0; padding:0; }

html, body {
  width:100%; height:100%;
  overflow: hidden;
}

body {
  font-family: 'Nunito', sans-serif;
  background: radial-gradient(ellipse at 30% 20%, #2a1f5e 0%, #1a1a2e 40%, #0d1117 100%);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 0;
  min-height: 100vh;
  position: relative;
  user-select: none;
}

/* ── STARFIELD ── */
.stars {
  position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden;
}
.star {
  position: absolute;
  background: white;
  border-radius: 50%;
  animation: twinkle var(--dur) ease-in-out infinite;
  opacity: 0;
}
@keyframes twinkle {
  0%,100% { opacity:0; transform:scale(0.5); }
  50%     { opacity: var(--op); transform:scale(1); }
}

/* ── LAYOUT ── */
.page {
  position: relative; z-index: 10;
  display: flex; flex-direction: column;
  align-items: center;
  gap: 18px;
  padding: 12px 16px;
  width: 100%; max-width: 640px;
}

/* ── TITLE ── */
.title-block { text-align: center; }

.title-block h1 {
  font-family: 'Fredoka One', cursive;
  font-size: clamp(1.8rem, 4.5vw, 2.8rem);
  color: var(--gold);
  text-shadow: 0 0 30px rgba(255,215,0,0.5), 3px 3px 0 rgba(0,0,0,0.4);
  letter-spacing: 2px;
  line-height: 1;
}
.title-block p {
  font-size: clamp(0.7rem, 1.5vw, 0.9rem);
  color: rgba(255,255,255,0.6);
  font-weight: 700;
  margin-top: 2px;
}

/* ── WHEEL CONTAINER ── */
.wheel-wrap {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* Outer decorative ring */
.wheel-ring {
  position: absolute;
  border-radius: 50%;
  background: conic-gradient(
    #FFD700, #FF6B6B, #48DBFB, #1DD1A1, #A29BFE,
    #FECA57, #FF6B9D, #74B9FF, #FFD700
  );
  animation: ring-spin 12s linear infinite;
  z-index: 1;
}
@keyframes ring-spin { to { transform: rotate(360deg); } }

.wheel-ring-inner {
  position: absolute;
  border-radius: 50%;
  background: var(--bg-to);
  z-index: 2;
}

/* Canvas */
#wheelCanvas {
  position: relative;
  z-index: 3;
  border-radius: 50%;
  cursor: pointer;
  transition: filter 0.3s;
  display: block;
}

/* Pointer / flecha */
.pointer {
  position: absolute;
  top: -2px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 10;
  filter: drop-shadow(0 4px 8px rgba(0,0,0,0.5));
}

/* Hub central */
.hub {
  position: absolute;
  border-radius: 50%;
  background: radial-gradient(circle, #fff 0%, #e0c040 40%, #b8860b 100%);
  z-index: 9;
  box-shadow: 0 0 20px rgba(255,215,0,0.6), inset 0 2px 4px rgba(255,255,255,0.5);
  display: flex; align-items: center; justify-content: center;
  cursor: pointer;
  transition: transform 0.15s;
}
.hub:hover { transform: scale(1.08); }
.hub:active { transform: scale(0.95); }

.hub-text {
  font-family: 'Fredoka One', cursive;
  color: #5c3d00;
  font-weight: 900;
  text-align: center;
  line-height: 1.1;
  text-shadow: 0 1px 0 rgba(255,255,255,0.4);
}

/* ── RESULT DISPLAY ── */
.result-area {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  min-height: 90px;
}

.result-box {
  background: rgba(255,255,255,0.06);
  border: 2px solid rgba(255,215,0,0.25);
  border-radius: 20px;
  padding: 8px 28px;
  text-align: center;
  backdrop-filter: blur(8px);
  transition: all 0.3s;
  min-width: 240px;
}

.result-label {
  font-size: 0.72rem;
  font-weight: 800;
  color: rgba(255,255,255,0.5);
  text-transform: uppercase;
  letter-spacing: 1px;
}

.result-letter {
  font-family: 'Fredoka One', cursive;
  font-size: clamp(3.5rem, 10vw, 5.5rem);
  line-height: 1;
  color: var(--gold);
  text-shadow: 0 0 40px rgba(255,215,0,0.7), 4px 4px 0 rgba(0,0,0,0.3);
  transition: all 0.3s;
  min-height: 1em;
}

.result-letter.pop {
  animation: letterPop 0.5s cubic-bezier(0.34,1.56,0.64,1);
}
@keyframes letterPop {
  0%   { transform: scale(0.3) rotate(-15deg); opacity:0; }
  60%  { transform: scale(1.2) rotate(5deg);  opacity:1; }
  100% { transform: scale(1)   rotate(0deg);  opacity:1; }
}

.result-msg {
  font-family: 'Fredoka One', cursive;
  font-size: clamp(0.9rem, 2vw, 1.1rem);
  color: rgba(255,255,255,0.85);
  text-shadow: 1px 1px 4px rgba(0,0,0,0.4);
}

/* ── SPIN BUTTON ── */
.spin-btn {
  background: linear-gradient(135deg, #FFD700, #FF9500);
  color: #3d1f00;
  border: none;
  border-radius: 50px;
  padding: clamp(10px,2vw,14px) clamp(28px,5vw,52px);
  font-family: 'Fredoka One', cursive;
  font-size: clamp(1rem, 2.5vw, 1.4rem);
  letter-spacing: 0.5px;
  cursor: pointer;
  box-shadow: 0 6px 24px rgba(255,165,0,0.5), 0 2px 0 rgba(0,0,0,0.2);
  transition: all 0.18s cubic-bezier(0.34,1.56,0.64,1);
  position: relative;
  overflow: hidden;
}
.spin-btn::before {
  content:'';
  position:absolute; inset:0;
  background: linear-gradient(180deg, rgba(255,255,255,0.3) 0%, transparent 60%);
  border-radius: inherit;
  pointer-events:none;
}
.spin-btn:hover:not(:disabled) {
  transform: translateY(-3px) scale(1.04);
  box-shadow: 0 10px 32px rgba(255,165,0,0.6);
}
.spin-btn:active:not(:disabled) {
  transform: translateY(0) scale(0.98);
}
.spin-btn:disabled {
  background: linear-gradient(135deg, #555, #333);
  color: #888;
  cursor: not-allowed;
  box-shadow: none;
}

/* ── HISTORY ── */
.history-wrap {
  display: flex; flex-direction: column; align-items: center; gap: 5px;
  width: 100%;
}
.history-title {
  font-size: 0.7rem; font-weight: 800;
  color: rgba(255,255,255,0.35);
  text-transform: uppercase; letter-spacing: 1px;
}
.history-chips {
  display: flex; flex-wrap: wrap; gap: 5px;
  justify-content: center;
  max-height: 52px; overflow: hidden;
}
.chip {
  font-family: 'Fredoka One', cursive;
  font-size: 0.95rem;
  color: #1a1a2e;
  background: var(--chip-color, #FFD700);
  border-radius: 10px;
  width: 32px; height: 32px;
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 3px 8px rgba(0,0,0,0.3);
  animation: chipPop 0.3s cubic-bezier(0.34,1.56,0.64,1);
}
@keyframes chipPop {
  from { transform: scale(0); opacity:0; }
  to   { transform: scale(1); opacity:1; }
}

/* ── CONFETTI ── */
.confetti-piece {
  position: fixed;
  width: 10px; height: 10px;
  border-radius: 2px;
  pointer-events: none;
  z-index: 100;
  animation: confettiFall var(--dur2) ease-in forwards;
}
@keyframes confettiFall {
  0%   { transform: translateY(-20px) rotate(0deg) scale(1); opacity:1; }
  100% { transform: translateY(100vh) rotate(var(--rot)) scale(0.5); opacity:0; }
}

/* ── RESPONSIVE SIZES ── */
.size-vars { display:none; }
</style>
</head>
<body>

<div class="stars" id="stars"></div>

<div class="page">

  <!-- Title -->
  <div class="title-block">
    <h1>🎡 Ruleta de Letras</h1>
    <p>Girá la ruleta y descubrí la letra del juego</p>
  </div>

  <!-- Wheel -->
  <div class="wheel-wrap" id="wheelWrap">
    <div class="wheel-ring"       id="outerRing"></div>
    <div class="wheel-ring-inner" id="innerRing"></div>
    <canvas id="wheelCanvas"></canvas>

    <!-- Pointer arrow (SVG) -->
    <svg class="pointer" id="pointer" viewBox="0 0 40 52" fill="none" xmlns="http://www.w3.org/2000/svg">
      <filter id="pf"><feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000" flood-opacity="0.5"/></filter>
      <polygon points="20,50 2,4 38,4" fill="#FFD700" filter="url(#pf)"/>
      <polygon points="20,50 2,4 38,4" fill="url(#pg)"/>
      <defs>
        <linearGradient id="pg" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#fff9c4"/>
          <stop offset="100%" stop-color="#FF9500"/>
        </linearGradient>
      </defs>
      <ellipse cx="20" cy="6" rx="5" ry="5" fill="#fff" opacity="0.5"/>
    </svg>

    <!-- Hub -->
    <div class="hub" id="hub" onclick="spinWheel()">
      <span class="hub-text" id="hubText">¡GIRAR!</span>
    </div>
  </div>

  <!-- Result -->
  <div class="result-area">
    <div class="result-box" id="resultBox">
      <div class="result-label">Letra sorteada</div>
      <div class="result-letter" id="resultLetter">?</div>
    </div>
    <div class="result-msg" id="resultMsg">Presioná ¡GIRAR! para empezar</div>
  </div>

  <!-- Button -->
  <button class="spin-btn" id="spinBtn" onclick="spinWheel()">🎰 ¡GIRAR RULETA!</button>

  <!-- History -->
  <div class="history-wrap">
    <div class="history-title">Letras anteriores</div>
    <div class="history-chips" id="historyChips"></div>
  </div>

</div>

<script>
// ══════════════════════════════════════
//  CONFIG
// ══════════════════════════════════════
const LETTERS = [
  'A','B','C','D','E','F','G','H','I','J','k',
  'L','M','N','O','P','Q','R','S','T','U','V','Z'
];
const N = LETTERS.length; // 21

const COLORS = [
  '#FF6B6B','#FF9F43','#FECA57','#48DBFB','#1DD1A1',
  '#FF6B9D','#A29BFE','#6C5CE7','#FD79A8','#00CEC9',
  '#E17055','#74B9FF','#55EFC4','#FDCB6E','#E84393',
  '#0984E3','#00B894','#D63031','#6D5BBA','#F9CA24',
  '#26de81'
];

const MESSAGES = [
  '¡Excelente! 🎉','¡Fantástico! 🌟','¡Genial! 🚀','¡Increíble! ✨',
  '¡Muy bien! 🎊','¡Perfecto! 💫','¡Sorprendente! 🌈','¡Asombroso! 🏆'
];

// ══════════════════════════════════════
//  STATE
// ══════════════════════════════════════
let currentAngle  = 0;       // radians, cumulative
let isSpinning    = false;
let history       = [];
let size          = 320;     // canvas size, updated on resize
let activeLetters = [...LETTERS];  // letras aún en la ruleta
let activeColors  = [...COLORS];   // colores alineados con activeLetters

// ══════════════════════════════════════
//  SIZING
// ══════════════════════════════════════
function computeSize() {
  const vw = window.innerWidth;
  const vh = window.innerHeight;
  // Leave room for title (~70px), result (~110px), button (~56px), history (~60px), gaps
  const available = Math.min(vw * 0.88, vh - 330);
  return Math.max(220, Math.min(380, available));
}

function applySize() {
  size = computeSize();
  const canvas = document.getElementById('wheelCanvas');
  canvas.width  = size;
  canvas.height = size;

  const wrap     = document.getElementById('wheelWrap');
  const ringSize = size + 20;
  const outerRing = document.getElementById('outerRing');
  const innerRing = document.getElementById('innerRing');
  outerRing.style.width  = ringSize + 'px';
  outerRing.style.height = ringSize + 'px';
  innerRing.style.width  = (ringSize - 8) + 'px';
  innerRing.style.height = (ringSize - 8) + 'px';

  wrap.style.width  = (ringSize + 8) + 'px';
  wrap.style.height = (ringSize + 8) + 'px';

  // Pointer
  const pSize = Math.round(size * 0.14);
  const pointer = document.getElementById('pointer');
  pointer.style.width  = pSize + 'px';
  pointer.style.height = (pSize * 1.3) + 'px';
  pointer.style.top    = (-pSize * 0.55) + 'px';

  // Hub
  const hubSize = Math.round(size * 0.22);
  const hub = document.getElementById('hub');
  hub.style.width  = hubSize + 'px';
  hub.style.height = hubSize + 'px';
  hub.style.marginLeft = (-hubSize/2) + 'px';
  hub.style.marginTop  = (-hubSize/2) + 'px';
  hub.style.left = '50%';
  hub.style.top  = '50%';
  hub.style.position = 'absolute';

  const hubText = document.getElementById('hubText');
  hubText.style.fontSize = Math.round(size * 0.055) + 'px';

  drawWheel(currentAngle);
}

window.addEventListener('resize', () => { applySize(); });

// ══════════════════════════════════════
//  DRAW WHEEL
// ══════════════════════════════════════
function drawWheel(angle) {
  const canvas = document.getElementById('wheelCanvas');
  const ctx    = canvas.getContext('2d');
  const cx = size / 2, cy = size / 2;
  const R  = size / 2 - 4;

  ctx.clearRect(0, 0, size, size);

  const n = activeLetters.length;
  if (n === 0) return;
  const sliceAngle = (2 * Math.PI) / n;

  // Shadow
  ctx.save();
  ctx.shadowColor   = 'rgba(0,0,0,0.5)';
  ctx.shadowBlur    = 30;
  ctx.shadowOffsetY = 10;
  ctx.beginPath();
  ctx.arc(cx, cy, R, 0, 2 * Math.PI);
  ctx.fillStyle = '#000';
  ctx.fill();
  ctx.restore();

  // Slices
  for (let i = 0; i < n; i++) {
    const startA = angle + i * sliceAngle - Math.PI / 2;
    const endA   = startA + sliceAngle;
    const color  = activeColors[i];

    // Sector fill
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.arc(cx, cy, R, startA, endA);
    ctx.closePath();
    ctx.fillStyle = color;
    ctx.fill();

    // Sheen gradient
    const grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, R);
    grad.addColorStop(0,   'rgba(255,255,255,0.18)');
    grad.addColorStop(0.5, 'rgba(255,255,255,0.04)');
    grad.addColorStop(1,   'rgba(0,0,0,0.1)');
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.arc(cx, cy, R, startA, endA);
    ctx.closePath();
    ctx.fillStyle = grad;
    ctx.fill();

    // Sector border
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.arc(cx, cy, R, startA, endA);
    ctx.closePath();
    ctx.strokeStyle = 'rgba(255,255,255,0.35)';
    ctx.lineWidth   = 1.5;
    ctx.stroke();

    // Letter
    const midA   = startA + sliceAngle / 2;
    const textR  = R * 0.68;
    const tx     = cx + textR * Math.cos(midA);
    const ty     = cy + textR * Math.sin(midA);
    const fsize  = Math.round(size * 0.068);

    ctx.save();
    ctx.translate(tx, ty);
    ctx.rotate(midA + Math.PI / 2);

    // Text shadow
    ctx.fillStyle   = 'rgba(0,0,0,0.35)';
    ctx.font        = `900 ${fsize}px 'Fredoka One', cursive`;
    ctx.textAlign   = 'center';
    ctx.textBaseline= 'middle';
    ctx.fillText(activeLetters[i], 2, 2);

    // Text
    ctx.fillStyle = '#fff';
    ctx.fillText(activeLetters[i], 0, 0);
    ctx.restore();
  }

  // Outer ring border
  ctx.beginPath();
  ctx.arc(cx, cy, R, 0, 2 * Math.PI);
  ctx.strokeStyle = 'rgba(255,255,255,0.15)';
  ctx.lineWidth   = 3;
  ctx.stroke();

  // Gold outer ring
  ctx.beginPath();
  ctx.arc(cx, cy, R + 2, 0, 2 * Math.PI);
  ctx.strokeStyle = '#FFD70066';
  ctx.lineWidth   = 2;
  ctx.stroke();
}

// ══════════════════════════════════════
//  SPIN LOGIC
// ══════════════════════════════════════
function spinWheel() {
  if (isSpinning) return;
  isSpinning = true;

  const btn = document.getElementById('spinBtn');
  const hub  = document.getElementById('hub');
  btn.disabled = true;
  document.getElementById('resultLetter').textContent = '?';
  document.getElementById('resultMsg').textContent    = 'Girando…';
  document.getElementById('resultBox').style.borderColor = 'rgba(255,215,0,0.25)';

  // Random destination
  const extraSpins   = 6 + Math.random() * 6;          // 6-12 full turns
  const targetOffset = Math.random() * 2 * Math.PI;    // random final position
  const totalRotation = extraSpins * 2 * Math.PI + targetOffset;

  const duration = 3500 + Math.random() * 1500;        // 3.5-5 sec
  const startTime = performance.now();
  const startAngle = currentAngle;

  function easeOut(t) {
    return 1 - Math.pow(1 - t, 4);
  }

  function frame(now) {
    const elapsed = now - startTime;
    const t       = Math.min(elapsed / duration, 1);
    const eased   = easeOut(t);

    currentAngle = startAngle + totalRotation * eased;
    drawWheel(currentAngle);

    if (t < 1) {
      requestAnimationFrame(frame);
    } else {
      currentAngle = startAngle + totalRotation;
      drawWheel(currentAngle);
      onSpinEnd();
    }
  }

  requestAnimationFrame(frame);
}

function onSpinEnd() {
  const n = activeLetters.length;
  if (n === 0) return;

  // Determine which sector the pointer (top) landed on
  const sliceAngle   = (2 * Math.PI) / n;
  const normalized   = ((currentAngle % (2 * Math.PI)) + 2 * Math.PI) % (2 * Math.PI);
  const pointerAngle = (2 * Math.PI - normalized) % (2 * Math.PI);
  const index  = Math.floor(pointerAngle / sliceAngle) % n;
  const letter = activeLetters[index];
  const color  = activeColors[index];

  // Show result
  const resultLetter = document.getElementById('resultLetter');
  resultLetter.textContent = letter;
  resultLetter.style.color = color;
  resultLetter.style.textShadow = '0 0 40px ' + color + '88, 4px 4px 0 rgba(0,0,0,0.3)';
  resultLetter.classList.remove('pop');
  void resultLetter.offsetWidth;
  resultLetter.classList.add('pop');

  const msg = MESSAGES[Math.floor(Math.random() * MESSAGES.length)];
  document.getElementById('resultMsg').textContent = msg;
  document.getElementById('resultBox').style.borderColor = color + '88';
  document.getElementById('resultBox').style.background  = color + '18';

  // Hub text
  document.getElementById('hubText').textContent = letter;
  document.getElementById('hub').style.background =
    'radial-gradient(circle, #fff 0%, ' + color + ' 50%, ' + color + '99 100%)';

  // History
  addToHistory(letter, color);

  // Confetti
  launchConfetti(color);

  // ── REMOVE letter from wheel ──
  activeLetters.splice(index, 1);
  activeColors.splice(index, 1);
  // Reset angle so the smaller wheel draws cleanly
  currentAngle = 0;

  isSpinning = false;

  if (activeLetters.length === 0) {
    showCompleted();
  } else {
    document.getElementById('spinBtn').disabled = false;
    drawWheel(currentAngle);
  }
}

function showCompleted() {
  const resultLetter = document.getElementById('resultLetter');
  resultLetter.textContent   = '¡Fin!';
  resultLetter.style.color   = '#FFD700';
  resultLetter.style.textShadow = '0 0 40px rgba(255,215,0,0.8)';
  resultLetter.style.fontSize   = 'clamp(2rem,6vw,3.5rem)';
  document.getElementById('resultMsg').textContent = '¡Se sortearon todas las letras! 🏆';
  document.getElementById('resultBox').style.borderColor = '#FFD70088';
  document.getElementById('resultBox').style.background  = 'rgba(255,215,0,0.12)';

  const canvas = document.getElementById('wheelCanvas');
  const ctx    = canvas.getContext('2d');
  const cx = size / 2, cy = size / 2, R = size / 2 - 4;
  ctx.clearRect(0, 0, size, size);
  // Draw empty circle with trophy
  ctx.beginPath();
  ctx.arc(cx, cy, R, 0, 2 * Math.PI);
  ctx.fillStyle = '#1a1a3e';
  ctx.fill();
  ctx.strokeStyle = '#FFD70066';
  ctx.lineWidth = 3;
  ctx.stroke();
  ctx.font = (size * 0.28) + 'px serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('🏆', cx, cy);

  document.getElementById('hubText').textContent = '↺';
  document.getElementById('hub').style.background =
    'radial-gradient(circle, #fff 0%, #FFD700 50%, #FF9500 100%)';
  document.getElementById('hub').onclick = resetWheel;

  const btn = document.getElementById('spinBtn');
  btn.textContent = '🔄 Reiniciar ruleta';
  btn.disabled    = false;
  btn.onclick     = resetWheel;

  launchConfetti('#FFD700');
  launchConfetti('#FF6B6B');
}

function resetWheel() {
  activeLetters = [...LETTERS];
  activeColors  = [...COLORS];
  currentAngle  = 0;
  history       = [];
  document.getElementById('historyChips').innerHTML = '';
  const rl = document.getElementById('resultLetter');
  rl.textContent  = '?';
  rl.style.color  = 'var(--gold)';
  rl.style.textShadow = '0 0 40px rgba(255,215,0,0.7), 4px 4px 0 rgba(0,0,0,0.3)';
  rl.style.fontSize   = '';
  document.getElementById('resultMsg').textContent = 'Presioná ¡GIRAR! para empezar';
  document.getElementById('resultBox').style.borderColor = 'rgba(255,215,0,0.25)';
  document.getElementById('resultBox').style.background  = 'rgba(255,255,255,0.06)';
  document.getElementById('hubText').textContent = '¡GIRAR!';
  document.getElementById('hub').style.background =
    'radial-gradient(circle, #fff 0%, #e0c040 40%, #b8860b 100%)';
  document.getElementById('hub').onclick = spinWheel;
  const btn = document.getElementById('spinBtn');
  btn.textContent = '🎰 ¡GIRAR RULETA!';
  btn.onclick     = spinWheel;
  btn.disabled    = false;
  drawWheel(0);
}

// ══════════════════════════════════════
//  HISTORY
// ══════════════════════════════════════
function addToHistory(letter, color) {
  history.unshift({ letter, color });
  if (history.length > 20) history.pop();

  const container = document.getElementById('historyChips');
  container.innerHTML = '';
  history.forEach(h => {
    const chip = document.createElement('div');
    chip.className = 'chip';
    chip.textContent = h.letter;
    chip.style.setProperty('--chip-color', h.color);
    container.appendChild(chip);
  });
}

// ══════════════════════════════════════
//  CONFETTI
// ══════════════════════════════════════
function launchConfetti(baseColor) {
  const colors = [baseColor, '#FFD700', '#fff', '#FF6B6B', '#48DBFB'];
  for (let i = 0; i < 40; i++) {
    setTimeout(() => {
      const el = document.createElement('div');
      el.className = 'confetti-piece';
      el.style.left = (20 + Math.random() * 60) + 'vw';
      el.style.top  = '-10px';
      el.style.background = colors[Math.floor(Math.random() * colors.length)];
      el.style.width  = (6 + Math.random() * 10) + 'px';
      el.style.height = (6 + Math.random() * 10) + 'px';
      el.style.setProperty('--dur2', (1.2 + Math.random() * 1.5) + 's');
      el.style.setProperty('--rot', (Math.random() * 720 - 360) + 'deg');
      el.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
      document.body.appendChild(el);
      setTimeout(() => el.remove(), 3000);
    }, i * 40);
  }
}

// ══════════════════════════════════════
//  STARFIELD
// ══════════════════════════════════════
function buildStars() {
  const container = document.getElementById('stars');
  for (let i = 0; i < 80; i++) {
    const s = document.createElement('div');
    s.className = 'star';
    const sz = 1 + Math.random() * 2.5;
    s.style.width  = sz + 'px';
    s.style.height = sz + 'px';
    s.style.left   = Math.random() * 100 + 'vw';
    s.style.top    = Math.random() * 100 + 'vh';
    s.style.setProperty('--dur', (2 + Math.random() * 4) + 's');
    s.style.setProperty('--op', (0.3 + Math.random() * 0.7).toFixed(2));
    s.style.animationDelay = (Math.random() * 5) + 's';
    container.appendChild(s);
  }
}

// ══════════════════════════════════════
//  INIT
// ══════════════════════════════════════
buildStars();
applySize();
</script>
